model:
  default: ag/gemini-3.8-flash-high
  provider: custom
  base_url: http://localhost:20128/v1
  api_key: ${HERMES_CUSTOM_LOCALHOST_20128_API_KEY}
fallback_providers:
- provider: custom
  model: ag/gemini-3.8-flash-low
  base_url: http://localhost:20128/v1
  key_env: HERMES_CUSTOM_LOCALHOST_20128_API_KEY
database:
  journal_mode: wal
runtime:
  nofile_soft_limit: 4096
agent:
  max_turns: 25
  service_tier: ''
  fast_auto_seconds: 60
  verbose: false
  reasoning_effort: medium
  personalities: {}
terminal:
  backend: local
  cwd: .
  timeout: 180
  home_mode: auto
  container_cpu: 1
  container_memory: 5120
  container_disk: 51200
  container_persistent: true
  docker_mount_cwd_to_workspace: false
  lifetime_seconds: 300
browser:
  backend: browser-use
  inactivity_timeout: 120
  extension_control:
    enabled: false
tool_loop_guardrails:
  warnings_enabled: true
  hard_stop_enabled: true
  non_interactive_hard_stop_enabled: true
  warn_after:
    exact_failure: 2
    same_tool_failure: 3
    idempotent_no_progress: 2
  hard_stop_after:
    exact_failure: 3
    same_tool_failure: 4
    idempotent_no_progress: 3
compression:
  enabled: true
  checkpoint_required: false
  progress_notices: false
  threshold: 0.5
  target_ratio: 0.2
  protect_last_n: 20
  min_tail_user_messages: 1
  max_attempts: 3
  proactive_prune_tokens: 0
  proactive_prune_min_result_chars: 8000
  proactive_prune_min_reclaim_tokens: 4096
  hygiene_max_turn_hold_seconds: 10
  protect_first_n: 3
  codex_gpt55_autoraise: true
  codex_app_server_auto: native
  codex_responses_native: false
  idle_compact_after_seconds: 0
prompt_caching:
  cache_ttl: 5m
display:
  compact: false
  busy_input_mode: interrupt
  bell_on_complete: false
  bell_on_prompt: false
  show_reasoning: false
  background_process_notifications: concise
  streaming: true
  skin: default
  interim_assistant_messages: true
  platforms:
    telegram:
      tool_progress: all
      tool_progress_grouping: accumulate
      tool_preview_length: 50
      long_running_notifications: true
      interim_assistant_messages: true
      busy_ack_detail: true
      cleanup_progress: true
  runtime_footer:
    enabled: true
    fields:
    - model
    - context_pct
    - latency
  tool_progress: all
  cleanup_progress: true
  long_running_notifications: true
  busy_ack_detail: true
dashboard:
  theme: default
  basic_auth:
    username: bagas
    password_hash: scrypt$16384$8$1$sfvpwRwT5dcxcYGXTVJzCA==$q4VIthza1qeSsHzMq/uU+ORo1AbRcj9HupDEY3SjCOo=
  public_url: https://www.jajandigital.web.id/hermes
  font: theme
tts:
  edge:
    voice: id-ID-GadisNeural
    speed: 1.2
  speed: 1.2
stt:
  enabled: true
  language: ''
  local:
    model: base
  openai:
    model: whisper-1
    language: ''
memory:
  memory_enabled: true
  user_profile_enabled: true
  memory_char_limit: 2200
  user_char_limit: 1375
  nudge_interval: 10
delegation:
  max_iterations: 250
  independent_completions: true
  subagent_auto_approve: true
skills:
  creation_nudge_interval: 15
timezone: Asia/Jakarta
approvals:
  mode: 'off'
  destructive_slash_confirm: false
plugins:
  enabled:
  - rtk-rewrite
  - skill-retriever
  disabled: []
  entries:
    rtk-rewrite:
      allow_tool_override: false
    skill-retriever:
      allow_tool_override: false
kanban:
  review_dispatch: true
code_execution:
  timeout: 300
  max_tool_calls: 50
gateway:
  signal_interrupt_grace_timeout: 1
  delivery_ledger: true
  platform_connect_timeout: 30
  loop_watchdog: true
  loop_watchdog_probe_interval_s: 30.0
  loop_watchdog_probe_timeout_s: 10.0
  loop_watchdog_max_strikes: 3
  startup_watchdog: true
  startup_watchdog_timeout_seconds: 300
  write_sessions_json: true
  scale_to_zero:
    idle_timeout_minutes: 2
  restart_loop_guard:
    max_restarts: 3
    window_seconds: 60
    max_gap_seconds: 300
  respawn_storm:
    max_starts: 5
    window_seconds: 120
  message_timestamps:
    enabled: false
  max_inbound_media_bytes: 134217728
  trust_env: true
  strict: false
  media_delivery_allow_dirs: []
  trust_recent_files: true
  trust_recent_files_seconds: 600
streaming:
  enabled: true
onboarding:
  seen:
    busy_input_prompt: true
    tool_progress_prompt: true
telemetry:
  shared_metrics:
    enabled: false
    send: false
updates:
