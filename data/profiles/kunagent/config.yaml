model:
  base_url: http://localhost:20128/v1
  default: ag/gemini-3.8-flash-medium
  provider: custom
  api_key: ${HERMES_CUSTOM_LOCALHOST_20128_API_KEY}
plugins:
  enabled: []
_config_version: 51
agent: {}
approvals:
  mode: manual
terminal:
  cwd: /home/ubuntu/otak-koding
compression:
  threshold_tokens: 50000
  proactive_prune_tokens: 30000
  protect_last_n: 10
  proactive_prune_min_result_chars: 4000
  proactive_prune_min_reclaim_tokens: 2048
