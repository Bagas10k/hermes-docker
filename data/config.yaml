model:
  api_mode: chat_completions
  base_url: http://localhost:20128/v1
  default: cx/gpt-6-luna
  provider: custom:lk
fallback_providers:
  - base_url: http://localhost:20128/v1
    key_env: HERMES_CUSTOM_LOCALHOST_20128_API_KEY
    model: ag/gemini-3.8-flash-low
    provider: custom:lk
database:
  journal_mode: wal
runtime:
  nofile_soft_limit: 4096
agent:
  max_turns: 25
  service_tier: ''
  fast_auto_seconds: 60
  verify_on_stop: true
  personalities: {}
  reasoning_effort: xhigh
  verbose: false
  gateway_notify_interval: 60
terminal:
  backend: local
  cwd: .
  timeout: 180
  home_mode: auto
  container_cpu: 1
  container_memory: 5120
  container_disk: 51200
  container_persistent: true
  docker_mount_cwd_to_workspace: false
  lifetime_seconds: 300
web:
  search_backend: ''
browser:
  backend: browser-use
  inactivity_timeout: 120
  extension_control:
    enabled: false
tool_loop_guardrails:
  warnings_enabled: true
  hard_stop_enabled: true
  non_interactive_hard_stop_enabled: true
  warn_after:
    exact_failure: 2
    same_tool_failure: 3
    idempotent_no_progress: 2
  hard_stop_after:
    exact_failure: 3
    same_tool_failure: 4
    idempotent_no_progress: 3
compression:
  enabled: true
  checkpoint_required: false
  progress_notices: false
  threshold: 0.5
  target_ratio: 0.2
  protect_last_n: 20
  min_tail_user_messages: 1
  max_attempts: 3
  proactive_prune_tokens: 0
  proactive_prune_min_result_chars: 8000
  proactive_prune_min_reclaim_tokens: 4096
  hygiene_max_turn_hold_seconds: 10
  protect_first_n: 3
  codex_gpt55_autoraise: true
  codex_app_server_auto: native
  codex_responses_native: false
  idle_compact_after_seconds: 0
prompt_caching:
  cache_ttl: 5m
display:
  compact: true
  busy_input_mode: interrupt
  bell_on_complete: false
  bell_on_prompt: false
  show_reasoning: true
  background_process_notifications: concise
  streaming: true
  inline_diffs: true
  skin: bagas-cockpit
  interim_assistant_messages: false
  platforms:
    telegram:
      streaming: true
      busy_ack_detail: true
      cleanup_progress: false
      interim_assistant_messages: true
      long_running_notifications: true
      tool_preview_length: 160
      tool_progress: verbose
      tool_progress_grouping: accumulate
      thinking_progress: true
  runtime_footer:
    enabled: true
    fields:
      - model
      - context_pct
      - cwd
      - latency
  status_bar:
    fields:
      - model
      - context_pct
      - bg_subagents
      - bg_processes
      - git_branch
      - latency
      - total_tokens
      - cache_hit
  busy_ack_detail: true
  cleanup_progress: false
  details_mode: collapsed
  long_running_notifications: true
  sections:
    activity: hidden
    thinking: collapsed
    tools: collapsed
  tool_progress: all
  tui_compact: true
  interface: cli
dashboard:
  theme: midnight
  basic_auth:
    username: bagas
    password_hash: scrypt$16384$8$1$sfvpwRwT5dcxcYGXTVJzCA==$q4VIthza1qeSsHzMq/uU+ORo1AbRcj9HupDEY3SjCOo=
  public_url: https://www.jajandigital.web.id/hermes
  font: jetbrains-mono
tts:
  edge:
    voice: id-ID-GadisNeural
    speed: 1.2
  speed: 1.2
stt:
  enabled: true
  language: ''
  local:
    model: base
  openai:
    model: whisper-1
    language: ''
memory:
  memory_enabled: true
  user_profile_enabled: true
  write_approval: false
  memory_char_limit: 3500
  user_char_limit: 2000
  nudge_interval: 10
delegation:
  model: ag/gemini-3.8-flash-high
  provider: custom:lk
  fallback_providers:
    - base_url: http://localhost:20128/v1
      model: ag/gemini-3.8-flash-low
      provider: custom:lk
  max_iterations: 60
  child_timeout_seconds: 180
  max_concurrent_children: 3
  independent_completions: true
  max_spawn_depth: 2
  orchestrator_enabled: true
  subagent_auto_approve: true
  surface_child_process_notifications: true
  worktree_isolation: true
skills:
  auto_load:
    - autonomous-orchestrator
    - advanced-gpu-aware-design-system
  creation_nudge_interval: 15
timezone: Asia/Jakarta
approvals:
  mode: 'off'
  destructive_slash_confirm: false
plugins:
  disabled: []
  enabled:
    - autonomous-orchestrator
    - disk-cleanup
    - flash-review
    - ponytail
    - rtk-rewrite
    - security-guidance
    - skill-retriever
  entries:
    autonomous-orchestrator:
      allow_tool_override: false
    flash-review:
      allow_tool_override: false
    rtk-rewrite:
      allow_tool_override: false
    skill-retriever:
      allow_tool_override: false
hooks:
  outbound:
    - events:
        - pre_tool_call
        - post_tool_call
        - pre_llm_call
        - on_session_start
        - on_session_finalize
        - post_llm_call
      name: aoms_native_stream
      timeout: 3
      url: http://127.0.0.1:3090/api/aoms/native-event
kanban:
  review_dispatch: true
code_execution:
  max_tool_calls: 50
  timeout: 300
gateway:
  signal_interrupt_grace_timeout: 1
  delivery_ledger: true
  platform_connect_timeout: 30
  loop_watchdog: true
  loop_watchdog_probe_interval_s: 30.0
  loop_watchdog_probe_timeout_s: 10.0
  loop_watchdog_max_strikes: 3
  startup_watchdog: true
  startup_watchdog_timeout_seconds: 300
  write_sessions_json: true
  scale_to_zero:
    idle_timeout_minutes: 2
  restart_loop_guard:
    max_restarts: 3
    window_seconds: 60
    max_gap_seconds: 300
  respawn_storm:
    max_starts: 5
    window_seconds: 120
  message_timestamps:
    enabled: true
  max_inbound_media_bytes: 134217728
  trust_env: true
  strict: false
  media_delivery_allow_dirs: []
  trust_recent_files: true
  trust_recent_files_seconds: 600
  api_server:
    max_concurrent_runs: 10
  multiplex_profiles: true
streaming:
  enabled: true
onboarding:
  seen:
    busy_input_prompt: true
    tool_progress_prompt: true
telemetry:
  shared_metrics:
    enabled: true
    send: true
    offer_version: 2
updates:
  check: true
  pre_update_backup: false
  backup_keep: 5
  non_interactive_local_changes: stash
_config_version: 51
