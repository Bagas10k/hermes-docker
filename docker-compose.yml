services:
  hermes:
    build: .
    image: hermes-cihuy:latest
    container_name: hermes-cihuy
    restart: unless-stopped
    ports:
      - "8642:8642"
      - "9119:9119"
    volumes:
      - ./data:/opt/data
      - ./workspace:/workspace
    environment:
      - HERMES_HOME=/opt/data
      - HERMES_DASHBOARD=1
      - HERMES_DASHBOARD_HOST=0.0.0.0
      - HERMES_DASHBOARD_PORT=9119
      - API_SERVER_ENABLED=true
      - API_SERVER_HOST=0.0.0.0
      - API_SERVER_PORT=8642
    env_file:
      - .env
    command: ["gateway", "run"]
