<!doctype html>
<html lang="id"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pengaturan preview</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#faf7f2;color:#14120e;font:16px system-ui;line-height:1.5}main{max-width:720px;margin:auto;padding:24px}button,select{font:inherit;min-height:48px;padding:10px 16px;border:2px solid #14120e;border-radius:6px;background:#c8e832;color:#14120e;cursor:pointer}button{box-shadow:3px 3px 0 #14120e}button:active{translate:2px 2px;box-shadow:1px 1px 0 #14120e}button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #1669e8;outline-offset:4px}dialog{padding:0;margin:auto auto 0;width:min(100%,560px);max-height:85dvh;overflow:hidden;border:2px solid #14120e;border-radius:12px 12px 0 0;background:#fff}dialog::backdrop{background:#14120e70}#handle{display:block;width:100%;background:#fbbf24;box-shadow:none;border:0;border-bottom:2px solid #14120e;touch-action:pan-x pinch-zoom;cursor:grab;border-radius:0}.content{padding:20px;padding-bottom:max(20px,env(safe-area-inset-bottom));max-height:calc(85dvh - 54px);overflow:auto;overscroll-behavior:contain}.row{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid #ddd}.row select{max-width:60%}input{width:24px;height:24px}footer{display:flex;gap:16px;flex-wrap:wrap;margin-top:24px}#close{background:#fff}h1{font-size:clamp(26px,6vw,40px)}h2{margin-top:0}#status{min-height:24px}@media(prefers-reduced-motion:reduce){button:active{translate:none}}
</style>
<main><h1>Pengaturan preview</h1><p>Atur kepadatan tampilan tanpa meninggalkan kanvas kerja.</p><button id="open">Atur tampilan</button><p id="status" role="status">Kepadatan: nyaman</p></main>
<dialog id="sheet" aria-labelledby="title"><button id="handle" aria-label="Pegangan geser; Escape untuk menutup">Geser ke bawah untuk menutup</button><div class="content"><h2 id="title">Tampilan kanvas</h2><label class="row">Kepadatan <select id="density" autofocus><option value="nyaman">Nyaman</option><option value="padat">Padat</option></select></label><label class="row">Getaran opsional <input id="haptics" type="checkbox"></label><p>Getaran hanya jika browser dan perangkat mendukung. Perubahan berlaku saat disimpan.</p><footer><button id="save">Simpan</button><button id="close">Batal</button></footer></div></dialog>
<script src="./motion.js"></script><script src="./sheet.js"></script></html>
