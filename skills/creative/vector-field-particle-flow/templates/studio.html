<!doctype html><html lang="id"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vector Flow Studio</title><style>body{margin:0;background:#faf6ef;color:#14120e;font:16px system-ui}main{max-width:960px;margin:auto;padding:24px}canvas{display:block;width:100%;height:320px;pointer-events:none;border-bottom:1px solid #c7c1b8}textarea{box-sizing:border-box;width:100%;height:160px;background:#fff;color:#14120e;padding:16px;font:16px monospace;border:1px solid #aaa}button{padding:12px;margin:8px 8px 8px 0}pre{white-space:pre-wrap}button:focus-visible,textarea:focus-visible{outline:3px solid #0369a1}</style><main><h1>Vector Flow Studio</h1><p>Gerak mengikuti aktivitas editor. Isi kode tetap lokal, tanpa evaluasi atau pengiriman jaringan.</p><canvas aria-hidden="true"></canvas><label for="code">Catatan kode</label><textarea id="code" spellcheck="false">// Mulai mengetik untuk membangunkan medan vektor.</textarea><button id="pause">Jeda</button><button id="resume">Lanjut</button><button id="stats">Periksa metrik</button><pre id="result" aria-live="polite"></pre></main><script type="module">import {createFlow} from '../scripts/flow.js';const flow=createFlow(document.querySelector('canvas'));window.flow=flow;document.querySelector('textarea').addEventListener('input',()=>flow.activity());document.querySelector('#pause').onclick=()=>flow.pause();document.querySelector('#resume').onclick=()=>flow.resume();document.querySelector('#stats').onclick=()=>document.querySelector('#result').textContent=JSON.stringify(flow.stats(),null,2);window.addEventListener('pagehide',()=>flow.dispose(),{once:true});</script></html>
