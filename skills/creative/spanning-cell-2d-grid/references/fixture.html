<!doctype html><html lang="en"><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Merged grid verification fixture</title>
<style>*{box-sizing:border-box}body{margin:0;padding:8px;background:#faf8f5;color:#17212b;font:14px sans-serif}
#frame{max-width:100%;overflow:auto}#grid{position:relative;overflow:hidden;background:white}
[role=row]{position:absolute;left:0;top:0;width:100%;height:0}
[role=gridcell]{position:absolute;border:1px solid #64748b;padding:3px;overflow:hidden;background:#fff}
[role=gridcell]:focus{outline:3px solid #1669e8;outline-offset:-3px}</style>
<div id="frame"><div id="grid" role="grid" aria-label="Merged grid test"></div></div>
<script>const data={"rows": 20, "cols": 20, "window": [2, 2, 6, 6], "width": 384, "height": 128, "cells": [{"id": "merge-7", "row": 1, "col": 1, "rowspan": 3, "colspan": 3, "left": -96, "top": -32, "width": 288, "height": 96}, {"id": "cell-2-4", "row": 2, "col": 4, "rowspan": 1, "colspan": 1, "left": 192, "top": 0, "width": 96, "height": 32}, {"id": "cell-2-5", "row": 2, "col": 5, "rowspan": 1, "colspan": 1, "left": 288, "top": 0, "width": 96, "height": 32}, {"id": "cell-3-4", "row": 3, "col": 4, "rowspan": 1, "colspan": 1, "left": 192, "top": 32, "width": 96, "height": 32}, {"id": "cell-3-5", "row": 3, "col": 5, "rowspan": 1, "colspan": 1, "left": 288, "top": 32, "width": 96, "height": 32}, {"id": "cell-4-2", "row": 4, "col": 2, "rowspan": 1, "colspan": 1, "left": 0, "top": 64, "width": 96, "height": 32}, {"id": "cell-4-3", "row": 4, "col": 3, "rowspan": 1, "colspan": 1, "left": 96, "top": 64, "width": 96, "height": 32}, {"id": "cell-4-4", "row": 4, "col": 4, "rowspan": 1, "colspan": 1, "left": 192, "top": 64, "width": 96, "height": 32}, {"id": "cell-4-5", "row": 4, "col": 5, "rowspan": 1, "colspan": 1, "left": 288, "top": 64, "width": 96, "height": 32}, {"id": "cell-5-2", "row": 5, "col": 2, "rowspan": 1, "colspan": 1, "left": 0, "top": 96, "width": 96, "height": 32}, {"id": "cell-5-3", "row": 5, "col": 3, "rowspan": 1, "colspan": 1, "left": 96, "top": 96, "width": 96, "height": 32}, {"id": "cell-5-4", "row": 5, "col": 4, "rowspan": 1, "colspan": 1, "left": 192, "top": 96, "width": 96, "height": 32}, {"id": "cell-5-5", "row": 5, "col": 5, "rowspan": 1, "colspan": 1, "left": 288, "top": 96, "width": 96, "height": 32}], "owners": {"2,2": "merge-7", "2,3": "merge-7", "3,2": "merge-7", "3,3": "merge-7", "2,4": "cell-2-4", "2,5": "cell-2-5", "3,4": "cell-3-4", "3,5": "cell-3-5", "4,2": "cell-4-2", "4,3": "cell-4-3", "4,4": "cell-4-4", "4,5": "cell-4-5", "5,2": "cell-5-2", "5,3": "cell-5-3", "5,4": "cell-5-4", "5,5": "cell-5-5"}};
const grid=document.getElementById('grid');
grid.style.width=data.width+'px';grid.style.height=data.height+'px';
grid.setAttribute('aria-rowcount',data.rows);grid.setAttribute('aria-colcount',data.cols);
const rows=new Map(), nodes=new Map();
for(const cell of data.cells){
 let row=rows.get(cell.row);
 if(!row){row=document.createElement('div');row.setAttribute('role','row');row.setAttribute('aria-rowindex',cell.row+1);grid.append(row);rows.set(cell.row,row);}
 const n=document.createElement('div');n.id=cell.id;n.setAttribute('role','gridcell');
 n.setAttribute('aria-rowindex',cell.row+1);n.setAttribute('aria-colindex',cell.col+1);
 n.setAttribute('aria-rowspan',cell.rowspan);n.setAttribute('aria-colspan',cell.colspan);
 for(const k of ['left','top','width','height'])n.style[k]=cell[k]+'px';
 n.textContent=cell.id;n.tabIndex=-1;row.append(n);nodes.set(cell.id,n);
}
let cursor=[data.window[0],data.window[1]];
function select(r,c,focus=true){const id=data.owners[r+','+c];if(!id)return;
 for(const n of nodes.values())n.tabIndex=-1;
 cursor=[r,c];const n=nodes.get(id);n.tabIndex=0;if(focus)n.focus({preventScroll:true});}
select(...cursor,false);
grid.addEventListener('keydown',e=>{
 const dirs={ArrowRight:[0,1],ArrowLeft:[0,-1],ArrowDown:[1,0],ArrowUp:[-1,0]};
 if(!dirs[e.key])return;e.preventDefault();const [dr,dc]=dirs[e.key];
 let [r,c]=cursor;const id=data.owners[r+','+c];
 do{r+=dr;c+=dc;}while(data.owners[r+','+c]===id);
 select(r,c);
});
grid.addEventListener('focusin',e=>{
 const id=data.owners[cursor.join(',')];if(e.target.id===id)return;
 const entry=Object.entries(data.owners).find(([,v])=>v===e.target.id);
 if(entry)select(...entry[0].split(',').map(Number),false);
});
window.fixtureReady=true;
</script></html>
