<!doctype html>
<html lang="id"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Komponen inquiry — adaptasi referensi</title>
<style>
:root{--accent:#ff70cf;--ink:#000;--paper:#faf8f5}*{box-sizing:border-box}body{margin:0;padding:clamp(20px,5vw,64px);background:var(--paper);color:var(--ink);font:18px/1.6 system-ui,sans-serif}main{max-width:760px}h1{font-size:clamp(30px,6vw,64px);line-height:1.1}button{max-width:100%;font:700 clamp(18px,4vw,32px)/1.2 system-ui;padding:20px 28px;border:3px solid var(--ink);border-radius:999px;background:var(--accent);color:var(--ink);cursor:pointer}button:active{transform:translateY(2px)}button:focus-visible,a:focus-visible{outline:3px solid var(--ink);outline-offset:5px}button svg{width:1em;height:1em;vertical-align:middle;margin-left:10px}section{border-top:1px solid;padding-top:20px;margin-top:32px}a{color:inherit}small{display:block;margin-top:32px}
</style><main><h1>Wujudkan ide berikutnya.</h1><p>Adaptasi komponen dari screenshot, bukan replika halaman atau integrasi pengiriman.</p><button id="inquiry" aria-expanded="false" aria-controls="contact">KIRIM PERTANYAAN<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 19 19 5M5 5h14v14"/></svg></button><section id="contact" hidden><h2 tabindex="-1">Jalur kontak</h2><p>Perilaku demo: panel informasi lokal. Sambungkan tujuan kontak terverifikasi sebelum rilis.</p><button id="close">Tutup</button></section><small>Warna aksen diukur dari crop CTA; perilaku panel adalah asumsi implementasi.</small></main><script>
const trigger=document.querySelector('#inquiry'),panel=document.querySelector('#contact');function closePanel(){panel.hidden=true;trigger.setAttribute('aria-expanded','false');trigger.focus()}trigger.addEventListener('click',()=>{panel.hidden=false;trigger.setAttribute('aria-expanded','true');panel.querySelector('h2').focus()});document.querySelector('#close').addEventListener('click',closePanel);document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!panel.hidden)closePanel()});
</script></html>
